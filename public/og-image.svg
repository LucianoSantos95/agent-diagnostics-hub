<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#1B3A5C"/>
      <stop offset="1" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- glow -->
  <circle cx="1050" cy="120" r="320" fill="#3b82f6" opacity="0.14"/>
  <circle cx="120" cy="560" r="260" fill="#7c3aed" opacity="0.12"/>

  <!-- badge -->
  <rect x="80" y="90" width="330" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <circle cx="108" cy="113" r="6" fill="#34d399"/>
  <text x="128" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#93c5fd">Diagnóstico gratuito · 2 minutos</text>

  <!-- headline -->
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Qual agente de IA</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">sua empresa</text>
  <text x="80" y="434" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent)">precisa primeiro?</text>

  <!-- subtitle -->
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#93c5fd">6 perguntas. Diagnóstico preciso. Sem testar ferramentas às cegas.</text>

  <!-- footer brand -->
  <rect x="80" y="545" width="44" height="44" rx="11" fill="url(#logo)"/>
  <path d="M96 567 L106 577 L120 559" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="576" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Focus<tspan fill="#60a5fa"> Indica</tspan></text>
</svg>
