<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fiBg" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#B428D6"/>
    </linearGradient>
    <filter id="fiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#fiBg)"/>

  <!-- Concentric target rings -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="256" cy="256" r="188" stroke-opacity="0.18" stroke-width="4"/>
    <circle cx="256" cy="256" r="150" stroke-opacity="0.32" stroke-width="4.5"
            stroke-dasharray="720 220" stroke-dashoffset="120"/>
    <circle cx="256" cy="256" r="112" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="256" cy="256" r="74" stroke-opacity="0.85" stroke-width="6"
            stroke-dasharray="330 130" stroke-dashoffset="80"/>
  </g>

  <!-- Center checkmark -->
  <path d="M212 258 L242 288 L300 222"
        fill="none" stroke="#ffffff" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Diagonal upward arrow with glow -->
  <g filter="url(#fiGlow)">
    <path d="M150 412 L376 150"
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M344 150 L378 148 L376 184"
          fill="none" stroke="#ffffff" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
